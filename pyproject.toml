[project]
name = "mcp-over-quik"
version = "0.1.5"
description = "MCP server for Sberbank webQUIK (webquik.sberbank.ru)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.6.0",
    "websockets>=14.0",
    "certifi>=2024.0.0",
]

[project.scripts]
mcp-over-quik = "mcp_over_quik.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_over_quik"]

[tool.hatch.build.targets.sdist]
include = ["src/mcp_over_quik", "README.md"]
