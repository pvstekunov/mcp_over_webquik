apiVersion: apps/v1
kind: Deployment
metadata:
  name: webquik-mcp
  namespace: infra
  labels:
    app.kubernetes.io/name: webquik-mcp
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webquik-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webquik-mcp
        app.kubernetes.io/component: mcp
    spec:
      imagePullSecrets:
        - name: mcp-over-quik-pull
      containers:
        - name: mcp
          image: cr.selcloud.ru/petrste/mcp-over-quik:v0.1.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: MCP_TRANSPORT
              value: streamable-http
            - name: MCP_HOST
              value: 0.0.0.0
            - name: MCP_PORT
              value: "3001"
            - name: WEBQUIK_HOST
              value: webquik.sberbank.ru
            - name: WEBQUIK_CA_BUNDLE
              value: /app/certs/sberca-chain.pem
            - name: WEBQUIK_SSL_VERIFY
              value: "true"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
